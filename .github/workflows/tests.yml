name: Continuous Integration & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install voluptuous aiohttp

      - name: Run Syntax Check
        run: |
          python -m py_compile custom_components/mocreo/__init__.py custom_components/mocreo/const.py custom_components/mocreo/config_flow.py custom_components/mocreo/sensor.py custom_components/mocreo/binary_sensor.py

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests
